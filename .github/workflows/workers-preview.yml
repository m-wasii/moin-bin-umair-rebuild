name: Worker preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: worker-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Upload Worker version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload aliased Worker preview
        id: upload
        run: |
          set -euo pipefail
          alias="pr-${{ github.event.pull_request.number }}"
          npx wrangler versions upload \
            --preview-alias "$alias" \
            --message "PR ${{ github.event.pull_request.number }} @ ${GITHUB_SHA:0:7}" \
            | tee wrangler-preview.log
          alias_url="$(sed -n 's/.*Preview Alias URL:[[:space:]]*//p' wrangler-preview.log | tr -d '[:space:]' | tail -n 1)"
          version_url="$(sed -n 's/.*Version Preview URL:[[:space:]]*//p' wrangler-preview.log | tr -d '[:space:]' | tail -n 1)"
          url="${alias_url:-$version_url}"
          if [ -z "$url" ]; then
            echo "Could not find a workers.dev preview URL in wrangler output." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "alias_url=$alias_url" >> "$GITHUB_OUTPUT"
          echo "version_url=$version_url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- workers-preview -->";
            const url = process.env.PREVIEW_URL;
            const body = [
              marker,
              "## Worker preview",
              "",
              url,
              "",
              "Aliased `workers.dev` URL for this PR. Production (`mbu`) is unchanged.",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
