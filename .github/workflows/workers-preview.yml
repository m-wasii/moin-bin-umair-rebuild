name: Worker preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: worker-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Runs for all PRs, including forks — no Cloudflare / production secrets.
  validate:
    name: Validate PR
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check (CI-critical paths)
        run: npm run validate:format

      - name: Astro check
        run: npm run check

      - name: Unit / helper verification
        run: npm run test

      - name: Build
        env:
          PUBLIC_BUILD_ID: ${{ github.sha }}
        run: npm run build

  preview:
    name: Deploy preview Worker
    needs: validate
    # Same-repo PRs only — forks never receive production Cloudflare secrets.
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Preview Workers do not receive CDN_PURGE_SECRET / Access / YouTube secrets.
    steps:
      - name: Require Cloudflare deploy secrets
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then re-run."
            exit 1
          fi
          echo "Cloudflare deploy secrets are present (values not printed)."

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          PUBLIC_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Deploy preview Worker
        id: deploy
        run: |
          set -euo pipefail
          name="mbu-pr-${{ github.event.pull_request.number }}"
          if [ "$name" = "mbu" ] || [ "$name" = "dashboard" ]; then
            echo "::error::Refusing to deploy over a production Worker name"
            exit 1
          fi
          if ! [[ "$name" =~ ^mbu-pr-[1-9][0-9]*$ ]]; then
            echo "::error::Unexpected preview Worker name: $name"
            exit 1
          fi
          npx wrangler deploy --name "$name" \
            --message "PR ${{ github.event.pull_request.number }} @ ${GITHUB_SHA:0:7}" \
            | tee wrangler-preview.log
          url="$(sed -n 's/^[[:space:]]*https:\/\/.*\.workers\.dev.*/&/p' wrangler-preview.log | tr -d '[:space:]' | tail -n 1)"
          if [ -z "$url" ]; then
            url="https://${name}.wasi-workdesk.workers.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const marker = "<!-- workers-preview -->";
            const url = process.env.PREVIEW_URL;
            const body = [
              marker,
              "## Worker preview",
              "",
              url,
              "",
              "This is a dedicated Worker (`mbu-pr-${{ github.event.pull_request.number }}`), not Pages. Production `mbu` is unchanged.",
              "",
              "Cache purge is skipped on preview (no production CDN_PURGE_SECRET).",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}

  cleanup:
    name: Delete preview Worker
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare secrets
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Delete preview Worker only
        run: |
          set -euo pipefail
          name="mbu-pr-${{ github.event.pull_request.number }}"
          if [ "$name" = "mbu" ] || [ "$name" = "dashboard" ]; then
            echo "::error::Refusing to delete production Worker name: $name"
            exit 1
          fi
          if ! [[ "$name" =~ ^mbu-pr-[1-9][0-9]*$ ]]; then
            echo "::error::Unexpected preview Worker name: $name"
            exit 1
          fi
          npx wrangler delete --name "$name" --force
        continue-on-error: true
