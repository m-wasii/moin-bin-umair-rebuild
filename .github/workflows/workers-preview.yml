name: Worker preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: worker-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy preview Worker
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set GitHub Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to auto-publish Worker previews."
          fi
      - uses: actions/checkout@v5
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ready == 'true'
      - run: npm run build
        if: steps.creds.outputs.ready == 'true'
      - name: Deploy preview Worker
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        run: |
          set -euo pipefail
          name="mbu-pr-${{ github.event.pull_request.number }}"
          npx wrangler deploy --name "$name" \
            --message "PR ${{ github.event.pull_request.number }} @ ${GITHUB_SHA:0:7}" \
            | tee wrangler-preview.log
          url="$(sed -n 's/^[[:space:]]*https:\/\/.*\.workers\.dev.*/&/p' wrangler-preview.log | tr -d '[:space:]' | tail -n 1)"
          if [ -z "$url" ]; then
            url="https://${name}.wasi-workdesk.workers.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        if: steps.creds.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- workers-preview -->";
            const url = process.env.PREVIEW_URL;
            const body = [
              marker,
              "## Worker preview",
              "",
              url,
              "",
              "This is a dedicated Worker (`mbu-pr-${{ github.event.pull_request.number }}`), not Pages. Production `mbu` is unchanged.",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}

  cleanup:
    name: Delete preview Worker
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ready == 'true'
      - name: Delete preview Worker
        if: steps.creds.outputs.ready == 'true'
        run: |
          npx wrangler delete --name "mbu-pr-${{ github.event.pull_request.number }}" --force
        continue-on-error: true
