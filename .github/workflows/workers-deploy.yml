name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: worker-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy mbu and dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CDN_PURGE_SECRET: ${{ secrets.CDN_PURGE_SECRET }}
      # Baked into HTML Cache-Tag at build time (belt-and-suspenders with purge).
      PUBLIC_BUILD_ID: ${{ github.sha }}
      MBU_SITE_ORIGIN: https://mbu.wasi-workdesk.workers.dev
    steps:
      - name: Require Cloudflare secrets
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID at https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions then re-run this workflow."
            exit 1
          fi
          if [ -z "${CDN_PURGE_SECRET:-}" ]; then
            echo "::error::Add repository secret CDN_PURGE_SECRET (same value as the mbu and dashboard Worker secrets) then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build and deploy Workers
        run: npm run deploy
      - name: Purge public Workers HTML cache
        run: node scripts/purge-workers-cache.mjs --scope everything --warm
      # Fail hard: a successful deploy must not leave stale HTML behind long s-maxage.
